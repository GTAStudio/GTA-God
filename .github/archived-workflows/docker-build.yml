# Archived historical orchestration, not a runnable GitHub workflow.
# Do not restore its publication path or use a production signing key here.
# Release source: GTA-God-Dev 785d8d2c8b633fe95c9a7e1c7244aab45b82cc6e
# GTAcore-SB: 68149fb99afa0de004e7af4865ab5a95b3909b69
name: Validate or Publish SB Image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docker-build.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed immutable SB image and promote aliases
        required: true
        default: false
        type: boolean

concurrency:
  group: sb-image-${{ github.ref }}
  # Never cancel a publication between immutable push and alias promotion.
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - name: Prepare source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.BUILD_SOURCE_REPOSITORY }}
          ref: 785d8d2c8b633fe95c9a7e1c7244aab45b82cc6e
          token: ${{ secrets.BUILD_TOKEN }}
          path: workspace/source
          persist-credentials: false

      - name: Prepare component
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GTAStudio/GTAcore-SB
          ref: 68149fb99afa0de004e7af4865ab5a95b3909b69
          token: ${{ secrets.BUILD_TOKEN }}
          path: workspace/component
          persist-credentials: false

      - name: Prepare builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version | grep -F "rustc ${RUSTUP_TOOLCHAIN} "

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Resolve fail-closed publication policy
        id: policy
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          ENABLED: ${{ vars.DOCKER_PUBLISH_ENABLED }}
          SIGNING_KEY: ${{ secrets.GTAGOD_COSIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          publish=false
          if [ "$REQUESTED" = true ]; then
            [ "$ENABLED" = true ] || {
              echo "publication is disabled by DOCKER_PUBLISH_ENABLED" >&2
              exit 1
            }
            [ -n "$SIGNING_KEY" ] || {
              echo "GTAGOD_COSIGN_PRIVATE_KEY is not configured" >&2
              exit 1
            }
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Install pinned Cosign
        if: steps.policy.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Install pinned Syft
        if: steps.policy.outputs.publish == 'true'
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      - name: Build and validate SB image
        env:
          SOURCE_DIR: ${{ github.workspace }}/workspace/source
          COMPONENT_SOURCE_DIR: ${{ github.workspace }}/workspace/component
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/gtagod
          RELEASE_ID: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISH_IMAGE: ${{ steps.policy.outputs.publish }}
          GTAGOD_COSIGN_KEY: env://GTAGOD_COSIGN_PRIVATE_KEY
          GTAGOD_COSIGN_PRIVATE_KEY: ${{ secrets.GTAGOD_COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.GTAGOD_COSIGN_PASSWORD }}
        run: |
          set +x
          sh "$SOURCE_DIR/scripts/publish-image.sh"