# Image assembly and publication pipeline.
name: Build and Publish Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - payload/**
      - .dockerignore
      - .github/workflows/docker-build.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify payload
        run: |
          cd payload
          sha256sum -c runtime.tar.gz.sha256
          test "$(tar -tzf runtime.tar.gz | LC_ALL=C sort | tr '\n' ' ')" = \
            "app/ app/edge app/legal/ app/legal/LICENSE app/legal/NOTICE app/legal/THIRD_PARTY_LICENSES.zip app/libcronet.so app/manager app/runtime "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: gta-god:candidate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify candidate
        env:
          IMAGE: gta-god:candidate-${{ github.sha }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = app
          docker run --rm --entrypoint /opt/gta-god/edge "$IMAGE" --version >/dev/null
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c \
            'test -x /opt/gta-god/manager && test -x /opt/gta-god/runtime && test -x /opt/gta-god/libcronet.so'

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: gta-god:candidate-${{ github.sha }}
          IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/gtagod
        run: |
          docker tag "$IMAGE" "${IMAGE_REPO}:latest"
          docker tag "$IMAGE" "${IMAGE_REPO}:${GITHUB_SHA}"
          docker push "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:${GITHUB_SHA}"