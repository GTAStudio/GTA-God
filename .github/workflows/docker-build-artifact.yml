name: Retired Supplied Artifact Lane

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-26.04
    steps:
      - name: Reject obsolete supplied binary acceptance
        run: |
          echo "::error::The supplied-artifact lane is retired. Historical unattested binaries remain blocked and cannot be published or deployed."
          exit 1
