# Public orchestration for an explicitly supplied, checksum-pinned GTACore daemon.
name: Build and Publish Supplied GTACore Image

on:
  workflow_dispatch:

concurrency:
  group: supplied-gtacore-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  ARTIFACT_RELEASE: docker-input-gtacore-669fac3
  ARTIFACT_SHA256: 669fac3e4ec3fe5cd13b6956055b0452f7abbc8f8b74636b4399657c3eac2ccb
  ARTIFACT_BUILD: dirty-bfa7113d

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Prepare release fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.BUILD_SOURCE_REPOSITORY }}
          ref: 9de3057ea2b90282abaf0a5181b73af95d050764
          token: ${{ secrets.BUILD_TOKEN }}
          path: source
          persist-credentials: false

      - name: Prepare builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download and verify private build input
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set -euo pipefail
          mkdir artifact
          gh release download "$ARTIFACT_RELEASE" \
            --repo GTAStudio/GTA-God-Dev \
            --dir artifact
          cat <<'CHECKSUMS' | sha256sum --check --strict -
          1af3c186bee8f1a5a021dcc1ac2325dc8eec70e74a6d5b17e4c9c64620b812a0  artifact/Dockerfile
          f5d1a50722886347782c52f272199c0ad31bf3f08b935ab3e28affba45197e83  artifact/artifact.json
          92fb2f417cc6c340d1416cbf7ad0de7484e4087ba19aa7fd558421feaf7dc50a  artifact/docker-entrypoint-artifact.sh
          669fac3e4ec3fe5cd13b6956055b0452f7abbc8f8b74636b4399657c3eac2ccb  artifact/gtacore
          03c88ce0090301e98ff1782c768fa4cbf00ec4bcb374e2b3b05641914661d7e3  artifact/ten-axis-smoke.sh
          CHECKSUMS
          test "$(jq -r .sha256 artifact/artifact.json)" = "$ARTIFACT_SHA256"
          test "$(jq -r .build artifact/artifact.json)" = "63bd244cca8f-$ARTIFACT_BUILD"
          chmod 0755 artifact/gtacore artifact/docker-entrypoint-artifact.sh artifact/ten-axis-smoke.sh
          artifact/gtacore --version | grep -F "$ARTIFACT_BUILD"

      - name: Build exact artifact candidate
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            --file artifact/Dockerfile \
            --tag local/gtagod:gtacore-669fac3 \
            --build-arg "GTACORE_ARTIFACT_SHA256=$ARTIFACT_SHA256" \
            --build-arg "GTACORE_ARTIFACT_BUILD=$ARTIFACT_BUILD" \
            artifact

      - name: Validate identity and ten-axis runtime
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint sha256sum local/gtagod:gtacore-669fac3 /usr/bin/gtacore | awk '{print $1}')" = "$ARTIFACT_SHA256"
          docker run --rm --entrypoint /usr/bin/gtacore local/gtagod:gtacore-669fac3 --version | grep -F "$ARTIFACT_BUILD"
          REPO="$GITHUB_WORKSPACE/source" IMAGE=local/gtagod:gtacore-669fac3 \
            sh artifact/ten-axis-smoke.sh

      - name: Publish verified image
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login \
            --username "$REGISTRY_USERNAME" --password-stdin
          repository="$REGISTRY_USERNAME/gtagod"
          artifact_tag="$repository:artifact-669fac3"
          build_tag="$repository:gtacore-dirty-bfa7113d"
          version_tag="$repository:v0.0.1-dirty-bfa7113d"
          latest_tag="$repository:latest"
          for tag in "$artifact_tag" "$build_tag" "$version_tag" "$latest_tag"; do
            docker tag local/gtagod:gtacore-669fac3 "$tag"
          done
          for tag in "$artifact_tag" "$build_tag" "$version_tag"; do
            docker push --quiet "$tag"
          done
          docker push --quiet "$latest_tag"
          expected=""
          for tag in "$artifact_tag" "$build_tag" "$version_tag" "$latest_tag"; do
            digest=$(docker buildx imagetools inspect "$tag" | awk '$1 == "Digest:" { print $2; exit }')
            test -n "$digest"
            if [ -z "$expected" ]; then
              expected="$digest"
            else
              test "$digest" = "$expected"
            fi
            printf '%s %s\n' "$tag" "$digest"
          done

      - name: Logout
        if: always()
        run: docker logout >/dev/null 2>&1 || true
