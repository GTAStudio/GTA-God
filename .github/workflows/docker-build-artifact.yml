# Public orchestration for an explicitly supplied, checksum-pinned GTACore daemon.
name: Build and Publish Supplied GTACore Image

on:
  workflow_dispatch:

concurrency:
  group: supplied-gtacore-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  ARTIFACT_RELEASE: docker-input-gtacore-7539138
  ARTIFACT_SHA256: 7539138ba920bc634baabf2a35a65c47f5f2c7eac0c4c173068a69d94251cbcd
  ARTIFACT_BUILD: 26e209d8d5af

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Prepare release fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.BUILD_SOURCE_REPOSITORY }}
          ref: 9de3057ea2b90282abaf0a5181b73af95d050764
          token: ${{ secrets.BUILD_TOKEN }}
          path: source
          persist-credentials: false

      - name: Prepare builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download and verify private build input
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set -euo pipefail
          mkdir artifact
          gh release download "$ARTIFACT_RELEASE" \
            --repo GTAStudio/GTA-God-Dev \
            --dir artifact
          test "$(find artifact -maxdepth 1 -type f | wc -l)" -eq 6
          cat <<'CHECKSUMS' | sha256sum --check --strict -
          44116241cadd340874fc3d1a008780e101dff28016d1f15059f998baad2fa670  artifact/Dockerfile
          b61c2512631a9f7f98fa14cdd06c8cb7323d3eb30bd79dee97dd91c66afccdc0  artifact/artifact.json
          d00fe6e09fbff01ffccfb8b541c3651c5a686d709e58ded2e11be6dce69cc0f0  artifact/docker-entrypoint-current.sh
          7539138ba920bc634baabf2a35a65c47f5f2c7eac0c4c173068a69d94251cbcd  artifact/gtacore
          56650983459ae938d6f3bad45e256afe506c9ea7ad25d2d76a6b63aebcdcd9c3  artifact/healthcheck-current.sh
          40eaacf006ded838ae70710b2d585f99c43abb88c4dfc6ab6a19a17c955e4884  artifact/ten-axis-smoke.sh
          CHECKSUMS
          test "$(jq -r .sha256 artifact/artifact.json)" = "$ARTIFACT_SHA256"
          test "$(jq -r .build artifact/artifact.json)" = "$ARTIFACT_BUILD"
          test "$(jq -r .gateway_source artifact/artifact.json)" = "aizhihuxiao/gtagod:gtacore-63bd244@sha256:d72151e65813a9c3f4b2708d18b08936cb5be8deaf41e496a0bd80d3ec32e3c6"
          chmod 0755 artifact/gtacore artifact/docker-entrypoint-current.sh \
            artifact/healthcheck-current.sh artifact/ten-axis-smoke.sh
          artifact/gtacore --version | grep -F "$ARTIFACT_BUILD"

      - name: Build exact artifact candidate
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            --file artifact/Dockerfile \
            --tag local/gtagod:gtacore-7539138 \
            --build-arg "GTACORE_ARTIFACT_SHA256=$ARTIFACT_SHA256" \
            --build-arg "GTACORE_ARTIFACT_BUILD=$ARTIFACT_BUILD" \
            artifact

      - name: Validate identity and ten-axis runtime
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint sha256sum local/gtagod:gtacore-7539138 /usr/bin/gtacore | awk '{print $1}')" = "$ARTIFACT_SHA256"
          docker run --rm --entrypoint /usr/bin/gtacore local/gtagod:gtacore-7539138 --version | grep -F "$ARTIFACT_BUILD"
          docker run --rm --entrypoint /usr/bin/gtagate local/gtagod:gtacore-7539138 --version | grep -F 'gtagate 0.0.1'
          REPO="$GITHUB_WORKSPACE/source" IMAGE=local/gtagod:gtacore-7539138 \
            sh artifact/ten-axis-smoke.sh

      - name: Publish verified image
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login \
            --username "$REGISTRY_USERNAME" --password-stdin
          repository="$REGISTRY_USERNAME/gtagod"
          artifact_tag="$repository:artifact-7539138"
          build_tag="$repository:gtacore-26e209d8d5af"
          version_tag="$repository:v0.0.1-26e209d8d5af"
          latest_tag="$repository:latest"
          for tag in "$artifact_tag" "$build_tag" "$version_tag" "$latest_tag"; do
            docker tag local/gtagod:gtacore-7539138 "$tag"
          done
          for tag in "$artifact_tag" "$build_tag" "$version_tag"; do
            docker push --quiet "$tag"
          done
          docker push --quiet "$latest_tag"
          expected=""
          for tag in "$artifact_tag" "$build_tag" "$version_tag" "$latest_tag"; do
            digest=$(docker buildx imagetools inspect "$tag" | awk '$1 == "Digest:" { print $2; exit }')
            test -n "$digest"
            if [ -z "$expected" ]; then
              expected="$digest"
            else
              test "$digest" = "$expected"
            fi
            printf '%s %s\n' "$tag" "$digest"
          done

      - name: Logout
        if: always()
        run: docker logout >/dev/null 2>&1 || true
