# Public orchestration for an explicitly supplied, checksum-pinned GTACore daemon.
name: Build and Publish Supplied GTACore Image

on:
  workflow_dispatch:

concurrency:
  group: supplied-gtacore-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  ARTIFACT_RELEASE: docker-input-gtacore-3af8ee3
  ARTIFACT_SHA256: 3af8ee36adb4b8411a2ad9badc08de8a00c6b328c13e3e71485eb5f71cf8935d
  ARTIFACT_BUILD: 7751dae1d81a-dirty-95de1e12513c
  ARTIFACT_VERSION: 0.0.2
  GATEWAY_SOURCE: aizhihuxiao/gtagod:gtacore-7751dae@sha256:c7f8ddf5beeb6b12eab4af8fe783429c5a66b1654a547d8b5f7505b1f2baad50

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Prepare release fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.BUILD_SOURCE_REPOSITORY }}
          ref: 23e15dcb101bbc2901105e89f4ca717050004517
          token: ${{ secrets.BUILD_TOKEN }}
          path: source
          persist-credentials: false

      - name: Prepare builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Download and verify private build input
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          set -euo pipefail
          mkdir artifact
          gh release download "$ARTIFACT_RELEASE" \
            --repo GTAStudio/GTA-God-Dev \
            --dir artifact
          test "$(find artifact -maxdepth 1 -type f | wc -l)" -eq 6
          cat <<'CHECKSUMS' | sha256sum --check --strict -
          94676b08a9f11ea550ff49a0f102a15cfe1a870136ca854e7147a840056a79db  artifact/Dockerfile
          1961e05bddcc90e05e4e1197e2ed334e9ee128fc97d202fe0281c6114e8e47a4  artifact/artifact.json
          d00fe6e09fbff01ffccfb8b541c3651c5a686d709e58ded2e11be6dce69cc0f0  artifact/docker-entrypoint-current.sh
          3af8ee36adb4b8411a2ad9badc08de8a00c6b328c13e3e71485eb5f71cf8935d  artifact/gtacore
          56650983459ae938d6f3bad45e256afe506c9ea7ad25d2d76a6b63aebcdcd9c3  artifact/healthcheck-current.sh
          fa7b18372337170c14fa57c1c8a33361e8c853eb7c7fe20771f99b1ec5f80a03  artifact/ten-axis-smoke.sh
          CHECKSUMS
          test "$(jq -r .sha256 artifact/artifact.json)" = "$ARTIFACT_SHA256"
          test "$(jq -r .build artifact/artifact.json)" = "$ARTIFACT_BUILD"
          test "$(jq -r .version artifact/artifact.json)" = "$ARTIFACT_VERSION"
          test "$(jq -r .gateway_source artifact/artifact.json)" = "$GATEWAY_SOURCE"
          chmod 0755 artifact/gtacore artifact/docker-entrypoint-current.sh \
            artifact/healthcheck-current.sh artifact/ten-axis-smoke.sh
          artifact/gtacore --version | grep -F "GTACore $ARTIFACT_VERSION"
          artifact/gtacore --version | grep -F "$ARTIFACT_BUILD"

      - name: Build exact artifact candidate
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            --file artifact/Dockerfile \
            --tag local/gtagod:gtacore-3af8ee3 \
            --build-arg "GTACORE_ARTIFACT_SHA256=$ARTIFACT_SHA256" \
            --build-arg "GTACORE_ARTIFACT_BUILD=$ARTIFACT_BUILD" \
            --build-arg "GTAGOD_VERSION=$ARTIFACT_VERSION" \
            artifact

      - name: Validate identity and ten-axis runtime
        run: |
          set -euo pipefail
          image=local/gtagod:gtacore-3af8ee3
          test "$(docker run --rm --entrypoint sha256sum "$image" /usr/bin/gtacore | awk '{print $1}')" = "$ARTIFACT_SHA256"
          docker run --rm --entrypoint /usr/bin/gtacore "$image" --version | grep -F "GTACore $ARTIFACT_VERSION"
          docker run --rm --entrypoint /usr/bin/gtacore "$image" --version | grep -F "$ARTIFACT_BUILD"
          test "$(docker run --rm --entrypoint /usr/bin/gtagate "$image" --version)" = "gtagate $ARTIFACT_VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" = "$ARTIFACT_VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "io.gtagod.gtacore.version" }}' "$image")" = "$ARTIFACT_VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "io.gtagod.gateway.version" }}' "$image")" = "$ARTIFACT_VERSION"
          docker run --rm --entrypoint /usr/bin/env "$image" | grep -Fx "GTAGOD_VERSION=$ARTIFACT_VERSION"
          docker run --rm --entrypoint /usr/bin/env "$image" | grep -Fx "GTACORE_RUST_VERSION=$ARTIFACT_VERSION"
          REPO="$GITHUB_WORKSPACE/source" IMAGE="$image" \
            sh artifact/ten-axis-smoke.sh

      - name: Publish verified image
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login \
            --username "$REGISTRY_USERNAME" --password-stdin
          repository="$REGISTRY_USERNAME/gtagod"
          artifact_tag="$repository:artifact-3af8ee3"
          build_tag="$repository:gtacore-$ARTIFACT_BUILD"
          version_build_tag="$repository:v$ARTIFACT_VERSION-$ARTIFACT_BUILD"
          version_tag="$repository:v$ARTIFACT_VERSION"
          latest_tag="$repository:latest"
          for tag in "$artifact_tag" "$build_tag" "$version_build_tag" "$version_tag" "$latest_tag"; do
            docker tag local/gtagod:gtacore-3af8ee3 "$tag"
          done
          for tag in "$artifact_tag" "$build_tag" "$version_build_tag" "$version_tag"; do
            docker push --quiet "$tag"
          done
          docker push --quiet "$latest_tag"
          expected=""
          for tag in "$artifact_tag" "$build_tag" "$version_build_tag" "$version_tag" "$latest_tag"; do
            digest=$(docker buildx imagetools inspect "$tag" | awk '$1 == "Digest:" { print $2; exit }')
            test -n "$digest"
            if [ -z "$expected" ]; then
              expected="$digest"
            else
              test "$digest" = "$expected"
            fi
            printf '%s %s\n' "$tag" "$digest"
          done

      - name: Logout
        if: always()
        run: docker logout >/dev/null 2>&1 || true
