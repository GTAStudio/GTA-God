# Public orchestration only. Product source and build credentials remain private.
# Release source: GTA-God-Dev bd974844dba3b339a09566063c9084c63622bbdf
# GTACore-Rust: 7034f53d6a5324bf2d882a3e00a17abf34eca9fa (0.0.13)
name: Validate or Publish Rust Image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docker-build-rust.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed immutable image and promote aliases
        required: true
        default: false
        type: boolean

concurrency:
  group: rust-image-publication
  # Never cancel a publication between immutable push and alias promotion.
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  RUSTUP_TOOLCHAIN: "1.99.1"
  PRODUCT_REVISION: bd974844dba3b339a09566063c9084c63622bbdf
  CORE_REVISION: 7034f53d6a5324bf2d882a3e00a17abf34eca9fa

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - name: Prepare trusted public orchestration and verification key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: workspace/orchestration
          persist-credentials: false

      - name: Prepare source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.BUILD_SOURCE_REPOSITORY }}
          ref: ${{ env.PRODUCT_REVISION }}
          token: ${{ secrets.BUILD_TOKEN }}
          path: workspace/source
          persist-credentials: false

      - name: Prepare GTACore-Rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GTAStudio/GTACore
          ref: ${{ env.CORE_REVISION }}
          fetch-depth: 0
          token: ${{ secrets.BUILD_TOKEN }}
          path: workspace/component
          persist-credentials: false

      - name: Prepare builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version | grep -F "rustc ${RUSTUP_TOOLCHAIN} "

      - name: Require accepted credential-free publisher contract
        env:
          SOURCE_DIR: ${{ github.workspace }}/workspace/source
          COMPONENT_SOURCE_DIR: ${{ github.workspace }}/workspace/component
          RELEASE_ID: ${{ github.sha }}
          PUBLISH_IMAGE: "false"
        run: |
          set -euo pipefail
          test "$(sh "$SOURCE_DIR/scripts/publish-rust-image.sh" --contract-version)" = 2 || {
            echo "::error::Publisher v2 must pass private CI before its exact source pin is advanced."
            exit 1
          }

      - name: Install checksum-pinned dependency and image scanners
        env:
          SOURCE_DIR: ${{ github.workspace }}/workspace/source
        run: sh "$SOURCE_DIR/scripts/install-release-tools.sh" cargo-deny cargo-audit trivy

      - name: Resolve fail-closed publication policy
        id: policy
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          ENABLED: ${{ vars.DOCKER_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          publish=false
          if [ "$REQUESTED" = true ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || {
              echo "publication is allowed only from main" >&2
              exit 1
            }
            [ "$ENABLED" = true ] || {
              echo "publication is disabled by DOCKER_PUBLISH_ENABLED" >&2
              exit 1
            }
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Install pinned Cosign
        if: steps.policy.outputs.publish == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      - name: Build and validate without registry or signing authority
        env:
          SOURCE_DIR: ${{ github.workspace }}/workspace/source
          COMPONENT_SOURCE_DIR: ${{ github.workspace }}/workspace/component
          RELEASE_ID: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISH_IMAGE: "false"
          PUBLISH_PHASE: validate
          RELEASE_POLICY: ${{ steps.policy.outputs.publish == 'true' && 'production' || 'validation-only' }}
          CANDIDATE_DIR: ${{ runner.temp }}/gtagod-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +x
          sh "$SOURCE_DIR/scripts/publish-rust-image.sh"

      - name: Authenticate immutable evidence and promote aliases
        if: steps.policy.outputs.publish == 'true'
        env:
          SOURCE_DIR: ${{ github.workspace }}/workspace/source
          COMPONENT_SOURCE_DIR: ${{ github.workspace }}/workspace/component
          EXPECTED_SOURCE_REVISION: ${{ env.PRODUCT_REVISION }}
          EXPECTED_CORE_REVISION: ${{ env.CORE_REVISION }}
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/gtagod
          RELEASE_ID: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISH_IMAGE: "true"
          PUBLISH_PHASE: publish
          CANDIDATE_DIR: ${{ runner.temp }}/gtagod-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          GTAGOD_COSIGN_KEY: env://GTAGOD_COSIGN_PRIVATE_KEY
          GTAGOD_COSIGN_PRIVATE_KEY: ${{ secrets.GTAGOD_COSIGN_PRIVATE_KEY }}
          GTAGOD_COSIGN_PUBLIC_KEY: ${{ github.workspace }}/workspace/orchestration/cosign.pub
          COSIGN_PASSWORD: ${{ secrets.GTAGOD_COSIGN_PASSWORD }}
        run: |
          set +x
          sh "$SOURCE_DIR/scripts/publish-rust-image.sh"
