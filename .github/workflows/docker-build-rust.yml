# Public orchestration only. Product source and build credentials remain private.
# Release source: GTA-God-Dev 785d8d2c8b633fe95c9a7e1c7244aab45b82cc6e
# GTACore-Rust wrapper: 31bc42d1b6ba7ea0705bea12d72a050627e712a6
name: Validate or Publish Rust Image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docker-build-rust.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed immutable image and promote aliases
        required: true
        default: false
        type: boolean

concurrency:
  group: rust-image-${{ github.ref }}
  # Never cancel a publication between immutable push and alias promotion.
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Prepare source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.BUILD_SOURCE_REPOSITORY }}
          ref: 785d8d2c8b633fe95c9a7e1c7244aab45b82cc6e
          token: ${{ secrets.BUILD_TOKEN }}
          path: workspace/source
          persist-credentials: false

      - name: Prepare GTACore-Rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GTAStudio/GTACore
          ref: 31bc42d1b6ba7ea0705bea12d72a050627e712a6
          token: ${{ secrets.BUILD_TOKEN }}
          path: workspace/component
          persist-credentials: false

      - name: Prepare builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Resolve fail-closed publication policy
        id: policy
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          ENABLED: ${{ vars.DOCKER_PUBLISH_ENABLED }}
          SIGNING_KEY: ${{ secrets.GTAGOD_COSIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          publish=false
          if [ "$REQUESTED" = true ]; then
            [ "$ENABLED" = true ] || {
              echo "publication is disabled by DOCKER_PUBLISH_ENABLED" >&2
              exit 1
            }
            [ -n "$SIGNING_KEY" ] || {
              echo "GTAGOD_COSIGN_PRIVATE_KEY is not configured" >&2
              exit 1
            }
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Install pinned Cosign
        if: steps.policy.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install pinned Syft
        if: steps.policy.outputs.publish == 'true'
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1

      - name: Build and validate Rust image
        env:
          SOURCE_DIR: ${{ github.workspace }}/workspace/source
          COMPONENT_SOURCE_DIR: ${{ github.workspace }}/workspace/component
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/gtagod
          RELEASE_ID: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PUBLISH_IMAGE: ${{ steps.policy.outputs.publish }}
          GTAGOD_COSIGN_KEY: env://GTAGOD_COSIGN_PRIVATE_KEY
          GTAGOD_COSIGN_PRIVATE_KEY: ${{ secrets.GTAGOD_COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.GTAGOD_COSIGN_PASSWORD }}
        run: |
          set +x
          sh "$SOURCE_DIR/scripts/publish-rust-image.sh"
