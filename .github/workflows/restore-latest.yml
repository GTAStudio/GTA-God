name: Restore GTAGod Latest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Restore previous verified latest
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PREVIOUS_DIGEST: sha256:d72151e65813a9c3f4b2708d18b08936cb5be8deaf41e496a0bd80d3ec32e3c6
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login \
            --username "$REGISTRY_USERNAME" --password-stdin
          repository="$REGISTRY_USERNAME/gtagod"
          docker buildx imagetools create \
            --tag "$repository:latest" \
            "$repository@$PREVIOUS_DIGEST"
          actual=$(docker buildx imagetools inspect "$repository:latest" \
            | awk '$1 == "Digest:" { print $2; exit }')
          test "$actual" = "$PREVIOUS_DIGEST"
          printf '%s:latest %s\n' "$repository" "$actual"

      - name: Logout
        if: always()
        run: docker logout >/dev/null 2>&1 || true
